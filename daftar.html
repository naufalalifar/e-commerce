<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar - Belanja YUKKK</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
</head>

<body class="bg-light">

    <!-- Tombol Kembali / Keluar di sudut atas -->
    <div class="position-absolute top-0 start-0 m-4">
        <a href="indexrev.html" class="text-decoration-none text-dark d-flex align-items-center gap-2 fs-5 fw-bold">
            <i class="bi bi-unindent"></i> Keluar
        </a>
    </div>
    <!-- Kontainer Utama (Posisi di Tengah Layar) -->
    <div class="container d-flex justify-content-center align-items-center vh-100">
        <div class="col-md-5 col-lg-4">

            <!-- Kartu Register dengan Efek Bayangan Lembut -->
            <div class="card border-0 shadow-lg rounded-4 p-4 p-md-5 bg-white">

                <!-- Judul & Brand -->
                <div class="text-center mb-4">
                    <h2 class="fw-bold text-primary">Belanja YUKKK</h2>
                    <p class="text-muted small">Buat akun baru Anda</p>
                </div>

                <form>
                    <!-- Input Nama Lengkap -->
                    <div class="mb-3">
                        <label for="nama" class="form-label text-secondary small fw-semibold">Nama Lengkap</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0"><i
                                    class="bi bi-card-text text-muted"></i></span>
                            <input type="text" class="form-control border-start-0 ps-0 bg-light" id="nama"
                                placeholder="Masukkan nama lengkap" required>
                        </div>
                    </div>

                    <!-- Input Username / Email -->
                    <div class="mb-3">
                        <label for="username" class="form-label text-secondary small fw-semibold">Username atau
                            Email</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0"><i
                                    class="bi bi-person text-muted"></i></span>
                            <input type="text" class="form-control border-start-0 ps-0 bg-light" id="username"
                                placeholder="Masukkan username/email" required>
                        </div>
                    </div>

                    <!-- Input Password -->
                    <div class="mb-4">
                        <label for="password" class="form-label text-secondary small fw-semibold">Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0"><i
                                    class="bi bi-lock text-muted"></i></span>
                            <input type="password" class="form-control border-start-0 ps-0 bg-light" id="password"
                                placeholder="Buat password" required>
                        </div>
                    </div>

                    <!-- Tombol Daftar -->
                    <div class="d-grid mb-3">
                        <button type="submit"
                            class="btn btn-warning py-2 fw-bold rounded-3 shadow-sm text-dark">Daftar</button>
                    </div>

                    <!-- Tautan Kembali ke Login -->
                    <p class="text-center text-muted small mt-4 mb-0">
                        Sudah punya akun? <a href="login.html"
                            class="text-decoration-none fw-semibold text-primary">Masuk sekarang</a>
                    </p>
                </form>

            </div>
        </div>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
