<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <title>Belanja Kuyyy</title>
    <link rel="stylesheet" href="stylerev.css">
    <script src="https://unpkg.com/feather-icons"></script>
    <link rel="icon" type="" href="img/logo.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL"
        crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
<!-- Tombol Kembali / Keluar di sudut atas -->
<div class="position-absolute top-0 start-0 m-4">
    <a href="indexrev.html" class="text-decoration-none text-dark d-flex align-items-center gap-2 fs-5 fw-bold">
        <i class="bi bi-unindent"></i> Keluar
    </a>
</div>

<!-- Kontainer Utama (Posisi di Tengah Layar) -->
<div class="container d-flex justify-content-center align-items-center vh-100">
    <div class="col-md-5 col-lg-4">

        <!-- Kartu Login dengan Efek Bayangan Lembut -->
        <div class="card border-0 shadow-lg rounded-4 p-4 p-md-5 bg-white">

            <!-- Judul & Brand -->
            <div class="text-center mb-0">
                <h2 class="fw-bold text-primary">Belanja YUKKK</h2>
                <p class="text-muted small">Silakan masuk ke akun Anda</p>
            </div>

            <form>
                <!-- Input Email / Username -->
                <div class="mb-3">
                    <label for="username" class="form-label text-secondary small fw-semibold">Username atau
                        Email</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0"><i
                                class="bi bi-person text-muted"></i></span>
                        <input type="text" class="form-control border-start-0 ps-0 bg-light" id="username"
                            placeholder="Masukkan username" required>
                    </div>
                </div>

                <!-- Input Password -->
                <div class="mb-3">
                    <label for="password" class="form-label text-secondary small fw-semibold">Password</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0"><i
                                class="bi bi-lock text-muted"></i></span>
                        <input type="password" class="form-control border-start-0 ps-0 bg-light" id="password"
                            placeholder="Masukkan password" required>
                    </div>
                </div>

                <!-- Opsi Tambahan: Remember Me & Lupa Password -->
                <div class="d-flex justify-content-between align-items-center mb-4 small">
                    <div class="form-check">
                        <input type="checkbox" class="form-check-input" id="remember">
                        <label class="form-check-label text-muted" for="remember">Ingat saya</label>
                    </div>
                    <a href="lupapass.html" class="text-decoration-none text-primary">Lupa password?</a>
                </div>

                <!-- Tombol Login -->
                <div class="d-grid mb-3">
                    <button type="submit" class="btn btn-warning py-2 fw-bold rounded-3 shadow-sm">Masuk</button>
                </div>

                <!-- Tautan ke Halaman Register -->
                <p class="text-center text-muted small mt-4 mb-0">
                    Belum punya akun? <a href="daftar.html" class="text-decoration-none fw-semibold text-primary">Daftar
                        sekarang</a>
                </p>
            </form>

        </div>
    </div>
</div>

    <!-- FOOTER -->
    <footer class="footer p-1 ">
        <div class="container text-center">
            <h5>Belanja <span class="brand-color">YUKKK</span></h5>
            <p>Belanja mudah, harga bersahabat.</p>
            <small>© 2026 Belanja YUKKK. Hak cipta dilindungi.</small>
        </div>
    </footer>
    <!--footer end-->
    <script>
        feather.replace();
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
        integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"
        integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y"
        crossorigin="anonymous"></script>
</body>
</html>
