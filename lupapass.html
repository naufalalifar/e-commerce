<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lupa Password - Belanja YUKKK</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
</head>

<body class="bg-light">

    <!-- Tombol Kembali / Keluar di sudut atas -->
<div class="position-absolute top-0 start-0 m-4">
    <a href="indexrev.html" class="text-decoration-none text-dark d-flex align-items-center gap-2 fs-5 fw-bold">
        <i class="bi bi-unindent"></i> Keluar
    </a>
</div>

    <!-- Kontainer Utama (Posisi di Tengah Layar) -->
    <div class="container d-flex justify-content-center align-items-center vh-100">
        <div class="col-md-5 col-lg-4">

            <!-- Kartu Lupa Password dengan Efek Bayangan Lembut -->
            <div class="card border-0 shadow-lg rounded-4 p-4 p-md-5 bg-white">

                <!-- Judul & Brand -->
                <div class="text-center mb-4">
                    <h2 class="fw-bold text-primary">Belanja YUKKK</h2>
                    <p class="text-muted small">Masukkan email atau username Anda untuk memulihkan password</p>
                </div>

                <form>
                    <!-- Input Email / Username -->
                    <div class="mb-4">
                        <label for="recovery" class="form-label text-secondary small fw-semibold">Username atau
                            Email</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0"><i
                                    class="bi bi-envelope text-muted"></i></span>
                            <input type="text" class="form-control border-start-0 ps-0 bg-light" id="recovery"
                                placeholder="Masukkan email terdaftar" required>
                        </div>
                    </div>

                    <!-- Tombol Kirim Instruksi -->
                    <div class="d-grid mb-3">
                        <button type="submit" class="btn btn-warning py-2 fw-bold rounded-3 shadow-sm text-dark">Kirim
                            Verifikasi</button>
                    </div>

                    <!-- Tautan Kembali ke Login -->
                    <p class="text-center text-muted small mt-4 mb-0">
                        Sudah ingat password? <a href="login.html"
                            class="text-decoration-none fw-semibold text-primary">Masuk sekarang</a>
                    </p>
                </form>

            </div>
        </div>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
